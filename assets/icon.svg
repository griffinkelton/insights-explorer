<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="gemGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <linearGradient id="glossGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:rgba(255,255,255,0.25)"/>
      <stop offset="50%" style="stop-color:rgba(255,255,255,0)"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square -->
  <rect x="32" y="32" width="448" height="448" rx="112" ry="112" fill="url(#gemGradient)"/>

  <!-- Gloss overlay (top half only for 3D effect) -->
  <rect x="32" y="32" width="448" height="224" rx="112" ry="112" fill="url(#glossGradient)"/>

  <!-- Abstract "lens" ring -->
  <circle cx="256" cy="256" r="140" fill="none" stroke="rgba(255,255,255,0.30)" stroke-width="12"/>

  <!-- Magnifying glass handle -->
  <line x1="355" y1="355" x2="425" y2="425" stroke="rgba(255,255,255,0.50)" stroke-width="16" stroke-linecap="round"/>

  <!-- Three bars inside the lens (simplified bar chart) -->
  <rect x="180" y="300" width="36" height="80" rx="8" fill="rgba(255,255,255,0.70)"/>
  <rect x="238" y="240" width="36" height="140" rx="8" fill="rgba(255,255,255,0.85)"/>
  <rect x="296" y="280" width="36" height="100" rx="8" fill="rgba(255,255,255,0.70)"/>
</svg>
