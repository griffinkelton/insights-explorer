# Pre-commit hooks — catch issues before they reach CI.
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-ast
        name: Check Python AST
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: debug-statements
      - id: check-added-large-files
        args: ['--maxkb=5000']
      - id: detect-private-key
      - id: check-case-conflict

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.5.0
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --line-length=100]
        files: '\.py$'

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        args: [--line-length=100]
        files: '\.py$'

  # Local guard: reject credential-shaped strings (AIza... / ya29...) in
  # staged text files before they reach git history. Regression guard for
  # the IDEAS #29 credential-rotation incident.
  - repo: local
    hooks:
      - id: check-credentials
        name: Check credential-shaped strings (AIza / ya29)
        entry: python scripts/check_credentials.py
        language: system
        types: [text]
        pass_filenames: true
