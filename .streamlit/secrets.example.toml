# Example secrets for Google Drive import (v0.3.0).
# Copy to .streamlit/secrets.toml and fill in real values. NEVER commit
# .streamlit/secrets.toml — it is gitignored. Only placeholders belong here.

# Google Picker developer key (browser API key).
# Create in GCP Console → APIs & Services → Credentials → API key.
# Restrict to: Google Picker API + exact HTTP referrers you run the app on
# (e.g. http://localhost:8501/* and http://127.0.0.1:8501/* for local dev,
# plus the deployed HTTPS origin).
GOOGLE_PICKER_API_KEY = ""

# Numeric Google Cloud project number (NOT the project ID).
# Found in GCP Console → IAM & Admin → Settings → "Project number".
# You may need to enable the Cloud Resource Manager API first:
#   https://console.cloud.google.com/apis/library/cloudresourcemanager.googleapis.com
# This is a 12-digit number, e.g. "123456789012".
# Used for Picker's setAppId() — required for the import flow.
GOOGLE_CLOUD_PROJECT_NUMBER = ""

# Exact app origin passed to Picker's setOrigin().
# Local dev: "http://localhost:8501" (must match an allowed key referrer).
# Production: the exact HTTPS origin — no path, query, or fragment.
DRIVE_PICKER_APP_ORIGIN = ""

# Development-only flag: true enables localhost/HTTP origin validation.
# In production this must be false (or absent) so HTTPS + non-local origins
# are enforced. Never set true in a deployed environment.
IS_DEVELOPMENT = false
