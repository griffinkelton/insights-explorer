name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Credential guard + FastAPI env-var allowlist
        run: |
          git ls-files -z | xargs -0 python scripts/check_credentials.py

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_drive_import_smoke.py \
            -v --tb=short \
            --cov=utils --cov=components --cov=pages \
            --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: components/drive_picker_component_frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: components/drive_picker_component_frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: components/drive_picker_component_frontend
        run: npm run check

      - name: Build production bundle
        working-directory: components/drive_picker_component_frontend
        run: npm run build

      - name: Verify bundle artifacts (index.html + hashed JS)
        working-directory: components/drive_picker_component_frontend
        run: |
          test -f build/index.html || { echo "build/index.html missing"; exit 1; }
          js_files=$(find build -name '*.js' -type f | wc -l | tr -d ' ')
          test "$js_files" -ge 1 || { echo "no JS assets in build/"; exit 1; }
          echo "bundle verified: build/index.html + $js_files JS asset(s)"

  frontend-port:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck + lint boundaries
        run: npm run check

      - name: Build production bundle
        run: npm run build

      - name: Unit + MSW component tests
        run: npm run test

      - name: Route-tree drift check
        run: |
          git diff --exit-code -- src/routeTree.gen.ts || {
            echo "routeTree.gen.ts drifted — run 'npm run build' locally and commit the regenerated file"
            exit 1
          }

      - name: Frontend no-secrets guard
        run: |
          cd ..
          git ls-files -z frontend | xargs -0 python scripts/check_credentials.py

  frontend-port-e2e:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Python test deps
        run: python -m pip install -r requirements/dev.txt

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Start FastAPI
        env:
          API_SESSION_SECRET: ${{ secrets.API_SESSION_SECRET }}
        run: |
          # If the repo has no API_SESSION_SECRET configured, boot with
          # ENVIRONMENT=test (config skips secret validation there) so the gate
          # still runs on forks/PRs without the secret.
          if [ -z "$API_SESSION_SECRET" ]; then
            ENVIRONMENT=test uvicorn api.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          else
            uvicorn api.main:app --host 127.0.0.1 --port 8000 > /tmp/uvicorn.log 2>&1 &
          fi
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8000/healthz >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:8000/healthz >/dev/null || { echo "FastAPI did not start"; cat /tmp/uvicorn.log; exit 1; }

      - name: Start Vite dev server
        working-directory: frontend
        run: |
          npm run dev > /tmp/vite.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5173 >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:5173 >/dev/null || { echo "Vite did not start"; cat /tmp/vite.log; exit 1; }

      - name: Run first-slice user-flow gate (Task 9)
        working-directory: frontend
        run: python -m pytest e2e/test_frontend_flow.py -v

  playwright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: components/drive_picker_component_frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: components/drive_picker_component_frontend
        run: npm ci

      - name: Build production bundle
        working-directory: components/drive_picker_component_frontend
        run: npm run build

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Drive-import browser smoke tests
        run: python -m pytest tests/test_drive_import_smoke.py -v
