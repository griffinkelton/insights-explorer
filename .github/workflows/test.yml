name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Credential guard + FastAPI env-var allowlist
        run: |
          git ls-files -z | xargs -0 python scripts/check_credentials.py

      - name: Run tests with coverage
        run: |
          python -m pytest tests/ \
            --ignore=tests/test_drive_import_smoke.py \
            -v --tb=short \
            --cov=utils --cov=components --cov=pages \
            --cov-report=term-missing

  frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: components/drive_picker_component_frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: components/drive_picker_component_frontend
        run: npm ci

      - name: Typecheck frontend
        working-directory: components/drive_picker_component_frontend
        run: npm run check

      - name: Build production bundle
        working-directory: components/drive_picker_component_frontend
        run: npm run build

      - name: Verify bundle artifacts (index.html + hashed JS)
        working-directory: components/drive_picker_component_frontend
        run: |
          test -f build/index.html || { echo "build/index.html missing"; exit 1; }
          js_files=$(find build -name '*.js' -type f | wc -l | tr -d ' ')
          test "$js_files" -ge 1 || { echo "no JS assets in build/"; exit 1; }
          echo "bundle verified: build/index.html + $js_files JS asset(s)"

  playwright:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: npm
          cache-dependency-path: components/drive_picker_component_frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: components/drive_picker_component_frontend
        run: npm ci

      - name: Build production bundle
        working-directory: components/drive_picker_component_frontend
        run: npm run build

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Run Drive-import browser smoke tests
        run: python -m pytest tests/test_drive_import_smoke.py -v
