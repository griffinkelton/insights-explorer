<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drive Picker transport</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
                     Oxygen, Ubuntu, sans-serif;
        font-size: 13px;
        padding: 8px;
        background: #fafafa;
      }

      .container {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      button {
        width: 100%;
        padding: 8px 12px;
        font-size: 13px;
        font-weight: 600;
        border: 1px solid rgba(128, 128, 128, 0.3);
        border-radius: 6px;
        cursor: pointer;
        background: #f0f0f5;
        color: #262730;
        transition: background 0.15s, border-color 0.15s, opacity 0.15s;
      }

      button:hover:not(:disabled) {
        background: #e0e0ea;
        border-color: #a0a0b0;
      }

      button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
      }

      #status {
        font-size: 12px;
        color: #888;
        min-height: 16px;
      }

      #status.success {
        color: #09ab3b;
        font-weight: 600;
      }

      #status.error {
        color: #e74c3c;
      }

      /* ── Dark theme (Synced with Streamlit sidebar) ──────────────── */
      body[data-theme="dark"] {
        background: #0e1117;
      }

      [data-theme="dark"] button {
        background: #262730;
        color: #fafafa;
        border-color: rgba(250, 250, 250, 0.15);
      }

      [data-theme="dark"] button:hover:not(:disabled) {
        background: #3d3d4a;
        border-color: #5a5a6a;
      }

      [data-theme="dark"] #status {
        color: #aaa;
      }

      [data-theme="dark"] #status.success {
        color: #09ab3b;
      }

      [data-theme="dark"] #status.error {
        color: #e74c3c;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <button id="open-picker" type="button" disabled>Loading…</button>
      <p id="status" role="status">Loading Picker library…</p>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
